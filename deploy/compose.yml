networks:
  internal:
  alwatr-public-network:
    name: alwatr-public-network
    external: true

services:
  api:
    image: $apiImage

    cpu_count: 1
    cpu_shares: 1024
    mem_limit: 256m

    stop_grace_period: 30s

    restart: unless-stopped

    networks:
      alwatr-public-network:

    environment:
      - dbPath=/data/db
      - initializeMode=${initializeMode:-}
      - botToken=${botToken}
      - DEBUG=${apiDebug:-}

    volumes:
      - type: bind
        source: ./_data/db
        target: /data/db
        bind:
          create_host_path: true

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '2'
